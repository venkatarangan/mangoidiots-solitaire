name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chrome

      - name: Run unit and artifact tests
        run: node --test tests/game.test.mjs tests/scoring.test.mjs tests/themes.test.mjs tests/mughal-theme.test.mjs tests/drop-targets.test.mjs tests/identity.test.mjs tests/pages.test.mjs

      - name: Run Pages browser smoke tests
        run: npx playwright test tests/gameplay.spec.js tests/experience.spec.js --grep "route types|branding|nested Pages path and resume route"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
