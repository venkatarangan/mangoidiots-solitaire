name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chrome

      - name: Run unit and artifact tests
        run: node --test tests/game.test.mjs tests/scoring.test.mjs tests/themes.test.mjs tests/mughal-theme.test.mjs tests/drop-targets.test.mjs tests/board-layout.test.mjs tests/identity.test.mjs tests/pages.test.mjs

      - name: Run Pages browser smoke tests
        run: npx playwright test tests/gameplay.spec.js tests/experience.spec.js tests/readability.spec.js tests/view-controls.spec.js --grep "route types|branding|nested Pages path and resume route|landscape screen fit|cached theme upgrade|landscape keeps|zoom and custom|completion displays"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
